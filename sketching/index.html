<body class="home">
  <div class="hero">
    <div class="sketch" role="img" aria-label="Ink sketch of a cemetery with a pencil drawing of a pillar and urns laid over it.">
      <div class="sketch-left"></div>
      <div class="sketch-right"></div>
      <div class="sk-base"></div>
      <div class="sk-overlay"></div>
    </div>

    <div class="sk-ui">
      <a class="sk-back" href="../">
        <svg viewBox="0 0 29 10" aria-hidden="true"><path d="M8 5H29" fill="none"/><path d="M0 5 9 1.5V8.500Z" stroke="none"/></svg>Back
      </a>
      <a class="sk-title" href="#sketch-1">
        <span class="sk-word">Sketching</span>
        <svg class="sk-arrow" viewBox="0 0 10 28" aria-hidden="true"><path d="M5 0V20" fill="none"/><path d="M5 28 1.500 19H8.500Z" stroke="none"/></svg>
      </a>
    </div>
  </div>

  <div class="sk-pages">
    <section class="sk-page" id="sketch-1" aria-label="Cypress sketches">
      <img src="../assets/sketching-1a.jpg" width="1000" height="1420" loading="lazy" alt="Pencil drawing of a slender spiral pillar and scattered urns, laid over a faint ink sketch of the cemetery.">
      <img src="../assets/sketching-1b.jpg" width="1000" height="1420" loading="lazy" alt="The same cemetery scene, with a tall pencil cypress tree and urns holding flowers.">
      <img src="../assets/sketching-1c.jpg" width="1000" height="1420" loading="lazy" alt="The same cemetery scene, with the cypress grown past the top of the frame and plants in the urns.">
    </section>

    <section class="sk-page" id="sketch-2" aria-label="Umbrella pine sketches">
      <img src="../assets/sketching-2a.jpg" width="1000" height="1100" loading="lazy" alt="Ink drawing of a street above a city of domes and rooftops, with people at a railing and a tree stump on the pavement.">
      <img src="../assets/sketching-2b.jpg" width="1000" height="1100" loading="lazy" alt="The same street, with a young pine tree staked where the stump was.">
      <img src="../assets/sketching-2c.jpg" width="1000" height="1100" loading="lazy" alt="The same street, with the pine grown into a tall umbrella pine.">
    </section>

    <!-- Rows of single sketches: three vertical, three horizontal, repeating. -->
    <section class="sk-page sk-row" id="sketch-3" aria-label="Sketches">
      <img src="../assets/sketching-3a.png" width="1200" height="1704" loading="lazy" alt="Pencil sketch of wide concrete steps seen from above, under a hatched overhang.">
      <img src="../assets/sketching-3b.png" width="1200" height="1704" loading="lazy" alt="Pencil sketch of a path running between two rows of tall cypress trees.">
      <img src="../assets/sketching-3c.png" width="1200" height="1704" loading="lazy" alt="Pencil sketch of a tower with plants spilling over its staggered balconies.">
    </section>

    <section class="sk-page sk-row sk-row-wide" id="sketch-4" aria-label="Sketches">
      <img src="../assets/sketching-4a.png" width="1200" height="840" loading="lazy" alt="Pencil sketch of a stadium with ribbed walls and a long roof truss.">
      <img src="../assets/sketching-4b.png" width="1200" height="840" loading="lazy" alt="Ink sketch of bare trees around a statue in a park, with buildings behind.">
      <img src="../assets/sketching-4c.png" width="1200" height="840" loading="lazy" alt="Ink sketch of a bridge with a railing over dark arches.">
    </section>

    <section class="sk-page sk-row" id="sketch-5" aria-label="Sketches">
      <img src="../assets/sketching-5a.png" width="1200" height="1704" loading="lazy" alt="Pencil sketch of a water tower framed by leafy branches and tall grass.">
      <img src="../assets/sketching-5b.png" width="1200" height="1704" loading="lazy" alt="Pencil sketch of a tall modernist apartment block above an open field of grass.">
      <img src="../assets/sketching-5c.png" width="1200" height="1704" loading="lazy" alt="Pencil sketch of a bare tree with its branches spreading wide.">
    </section>

    <section class="sk-page sk-row sk-row-wide" id="sketch-6" aria-label="Sketches">
      <img src="../assets/sketching-6a.png" width="1200" height="840" loading="lazy" alt="Ink sketch of an ancient amphitheatre's arched facade.">
      <img src="../assets/sketching-6b.png" width="1200" height="840" loading="lazy" alt="Ink sketch of a large corner building with rows of shuttered windows.">
      <img src="../assets/sketching-6c.png" width="1200" height="840" loading="lazy" alt="Pencil sketch of a parked scooter.">
    </section>

    <section class="sk-page sk-row sk-row-wide sk-pair" id="sketch-7" aria-label="Sketches">
      <img src="../assets/sketching-7a.png" width="1200" height="840" loading="lazy" alt="Pen sketch of a grand arched building front with columns behind bare trees, above a lawn with people sitting and walking.">
      <img src="../assets/sketching-7b.png" width="1200" height="840" loading="lazy" alt="Loose pen sketch of a pavilion with a wavy planted roof and tall glass walls, a figure standing in its doorway.">
    </section>
